# Settings for every server. Ansible loads everything in group_vars/all/
# automatically. Secrets live next door in vault.yml (encrypted); here we
# only reference them by their vault_* names.

# ---- Admin login -----------------------------------------------------------
# Defaults; set your real values in inventory/hosts.yml.
# The only account allowed to SSH in. Root login gets disabled.
admin_user: admin
admin_ssh_key_file: ~/.ssh/id_ed25519
admin_ssh_pubkey: "{{ lookup('file', admin_ssh_key_file + '.pub') }}"
ansible_ssh_private_key_file: "{{ admin_ssh_key_file }}"
admin_password: "{{ vault_admin_password }}"
# Lets Ansible answer the sudo prompt itself (no -K needed).
ansible_become_password: "{{ admin_password }}"

# ---- System ----------------------------------------------------------------
timezone: Etc/UTC
# Reboot automatically (at 04:00) when a security update needs it.
auto_reboot: false

# ---- Firewall --------------------------------------------------------------
# Ports open to the internet. SSH is always allowed (rate limited).
firewall_open_ports:
  - { port: "80", proto: tcp }    # HTTP (Caddy redirects to HTTPS, and Let's Encrypt uses it)
  - { port: "443", proto: tcp }   # HTTPS
  - { port: "443", proto: udp }   # HTTP/3
  - { port: "41641", proto: udp } # Tailscale direct connections (works without, just slower)

# ---- AIOStreams ------------------------------------------------------------
# Stremio only installs addons over HTTPS, so AIOStreams needs a domain whose
# DNS A record points at this VPS. Caddy gets a certificate for it automatically.
# Set it in inventory/hosts.yml.
aiostreams_domain: aiostreams.example.com
# Optional. Let's Encrypt sends certificate expiry warnings here.
acme_email: ""
# Pin exact versions so nothing changes unless you change it here.
aiostreams_image: ghcr.io/viren070/aiostreams:v2.36.0
aiostreams_uid: 10002
# Only reachable from the VPS itself; the internet reaches it through Caddy.
aiostreams_port: 3000
aiostreams_secret_key: "{{ vault_aiostreams_secret_key }}"
# Dashboard login, "username:password". The dashboard is admin-only.
aiostreams_auth: "{{ vault_aiostreams_auth }}"
aiostreams_mem_limit: 1g

# ---- Hermes Agent ----------------------------------------------------------
hermes_image: nousresearch/hermes-agent:v0.22.2
hermes_uid: 10001
# Environment variables handed to Hermes (API keys, bot tokens). See vault.yml.
hermes_env: "{{ vault_hermes_env }}"
hermes_mem_limit: 2g
# Dashboard at https://<tailscale_hostname>.<tailnet>.ts.net:<this port>
hermes_dashboard_tailnet_port: 9119
hermes_dashboard_user: admin
hermes_dashboard_password: "{{ vault_hermes_dashboard_password }}"
# Signs login sessions so they survive restarts. openssl rand -base64 32
hermes_dashboard_secret: "{{ vault_hermes_dashboard_secret }}"
