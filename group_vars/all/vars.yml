# Settings for every server. Ansible loads everything in group_vars/all/
# automatically. Secrets live next door in vault.yml (encrypted); here we
# only reference them by their vault_* names.

# ---- Admin login -----------------------------------------------------------
# The only account allowed to SSH in. Root login gets disabled.
admin_user: admin
admin_ssh_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
# SHA-512 crypt hash used for sudo. Generate with: openssl passwd -6
admin_password_hash: "{{ vault_admin_password_hash }}"

# ---- System ----------------------------------------------------------------
timezone: Etc/UTC
# Reboot automatically (at 04:00) when a security update needs it.
auto_reboot: false

# ---- Firewall --------------------------------------------------------------
# Ports open to the internet. SSH is always allowed (rate limited).
firewall_open_ports:
  - { port: "80", proto: tcp }    # HTTP (Caddy redirects to HTTPS, and Let's Encrypt uses it)
  - { port: "443", proto: tcp }   # HTTPS
  - { port: "443", proto: udp }   # HTTP/3
