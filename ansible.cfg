[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Refuse to talk to a server whose SSH host key changed (protects against MITM).
host_key_checking = True
interpreter_python = auto_silent
# Human-readable task output.
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
# Fewer SSH round trips per task = much faster runs.
pipelining = True
